[package]
name = "obsidian-rs-lsp"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
description = "An LSP server for interacting with Obsidian vaults"
authors = ["epwalsh <epwalsh10@gmail.com>"]
repository = "https://github.com/epwalsh/obsidian.rs"
homepage = "https://github.com/epwalsh/obsidian.rs"
readme = "../README.md"

[[bin]]
name = "obsidian-lsp"
path = "src/main.rs"

[dependencies]
obsidian-rs-core = { path = "../obsidian-core", version = "0.5.0" }
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6"
globset = "0.4"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
